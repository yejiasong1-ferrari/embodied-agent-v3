<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="612" viewBox="0 0 1120 612" role="img" aria-labelledby="title desc">
<title id="title">看不清时，选择能补足证据的观察</title>
<desc id="desc">日常使用640乘480，必要时使用1280乘960、移动视角或比较候选，仍不确定就明确停止。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#8edce5" stroke-width="1.6"/></marker>
<marker id="retry" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#edc68d" stroke-width="1.6"/></marker>
<marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#a4dfb9" stroke-width="1.6"/></marker>
</defs>
<rect width="1120" height="612" rx="20" fill="#101820"/>
<text x="40" y="55" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="650" text-anchor="start">看不清时，选择能补足证据的观察</text>
<text x="40" y="91" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">高清补细节，改变视角补遮挡，候选比较补身份歧义。</text>
<rect x="40" y="132" width="1040" height="78" rx="12" fill="#192630" stroke="#354853" stroke-width="1.4"/>
<text x="68" y="165" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="600" text-anchor="start">日常观察 · 640 × 480</text>
<text x="68" y="195" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">检查完整指令、可见区域和候选物体</text>
<path d="M560 214V247" fill="none" stroke="#edc68d" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#retry)"/>
<text x="560" y="276" fill="#edc68d" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="500" text-anchor="middle">需要更多证据时</text>
<path d="M560 286V300H190V315" fill="none" stroke="#edc68d" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#retry)"/>
<path d="M560 286V315" fill="none" stroke="#edc68d" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#retry)"/>
<path d="M560 286V300H930V315" fill="none" stroke="#edc68d" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#retry)"/>
<rect x="40" y="324" width="300" height="129" rx="12" fill="#192630" stroke="#354853" stroke-width="1.4"/>
<text x="60" y="362" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="600" text-anchor="start">细节不足</text>
<text x="60" y="400" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">采集 1280 × 960 高清图</text>
<text x="60" y="428" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">检查局部结构与表面特征</text>
<rect x="410" y="324" width="300" height="129" rx="12" fill="#192630" stroke="#354853" stroke-width="1.4"/>
<text x="430" y="362" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="600" text-anchor="start">物体被挡住</text>
<text x="430" y="400" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">安全规划新的观察位姿</text>
<text x="430" y="428" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">补拍侧面或斜面</text>
<rect x="780" y="324" width="300" height="129" rx="12" fill="#192630" stroke="#354853" stroke-width="1.4"/>
<text x="800" y="362" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="600" text-anchor="start">候选不明确</text>
<text x="800" y="400" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">结合指令比较相关候选</text>
<text x="800" y="428" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">在证据清楚后重新确认</text>
<path d="M190 459V481H930V459" fill="none" stroke="#8edce5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M560 459V496" fill="none" stroke="#8edce5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="185" y="505" width="750" height="54" rx="12" fill="#162e2a" stroke="#477d66" stroke-width="1.4"/>
<text x="560" y="540" fill="#a4dfb9" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="500" text-anchor="middle">再次检查身份和几何，再决定能否执行</text>
<text x="560" y="590" fill="#edc68d" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="middle">仍无法确认 → 给出原因并停止操作</text>
</svg>
