<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="612" viewBox="0 0 1120 612" role="img" aria-labelledby="title desc">
<title id="title">Ask for the observation that is missing</title>
<desc id="desc">Routine captures are 640 by 480. When needed, capture 1280 by 960 detail, change viewpoint or compare candidates. Unresolved evidence stops execution.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#8edce5" stroke-width="1.6"/></marker>
<marker id="retry" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#edc68d" stroke-width="1.6"/></marker>
<marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#a4dfb9" stroke-width="1.6"/></marker>
</defs>
<rect width="1120" height="612" rx="20" fill="#101820"/>
<text x="40" y="55" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="650" text-anchor="start">Ask for the observation that is missing</text>
<text x="40" y="91" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">Detail, occlusion and identity ambiguity call for different next observations.</text>
<rect x="40" y="132" width="1040" height="78" rx="12" fill="#192630" stroke="#354853" stroke-width="1.4"/>
<text x="68" y="165" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="600" text-anchor="start">Routine observation · 640 × 480</text>
<text x="68" y="195" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">Assess the full instruction, visible regions and candidate objects</text>
<path d="M560 214V247" fill="none" stroke="#edc68d" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#retry)"/>
<text x="560" y="276" fill="#edc68d" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="500" text-anchor="middle">When more evidence is needed</text>
<path d="M560 286V300H190V315" fill="none" stroke="#edc68d" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#retry)"/>
<path d="M560 286V315" fill="none" stroke="#edc68d" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#retry)"/>
<path d="M560 286V300H930V315" fill="none" stroke="#edc68d" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#retry)"/>
<rect x="40" y="324" width="300" height="129" rx="12" fill="#192630" stroke="#354853" stroke-width="1.4"/>
<text x="60" y="362" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="600" text-anchor="start">Too little detail</text>
<text x="60" y="400" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Capture 1280 × 960 detail</text>
<text x="60" y="428" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Inspect structure and features</text>
<rect x="410" y="324" width="300" height="129" rx="12" fill="#192630" stroke="#354853" stroke-width="1.4"/>
<text x="430" y="362" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="600" text-anchor="start">Occluded or out of view</text>
<text x="430" y="400" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Plan a safe observation pose</text>
<text x="430" y="428" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Capture a side or oblique view</text>
<rect x="780" y="324" width="300" height="129" rx="12" fill="#192630" stroke="#354853" stroke-width="1.4"/>
<text x="800" y="362" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="600" text-anchor="start">Ambiguous candidates</text>
<text x="800" y="400" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Compare relevant candidates</text>
<text x="800" y="428" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Reconfirm with visible evidence</text>
<path d="M190 459V481H930V459" fill="none" stroke="#8edce5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M560 459V496" fill="none" stroke="#8edce5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="185" y="505" width="750" height="54" rx="12" fill="#162e2a" stroke="#477d66" stroke-width="1.4"/>
<text x="560" y="540" fill="#a4dfb9" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="500" text-anchor="middle">Recheck identity and geometry before execution</text>
<text x="560" y="590" fill="#edc68d" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Still unresolved → stop with an explicit reason</text>
</svg>
