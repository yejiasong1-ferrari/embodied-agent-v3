<text x="656" y="292" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">Measured geometry</text>
<text x="656" y="321" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">Tracking + freshness</text>
