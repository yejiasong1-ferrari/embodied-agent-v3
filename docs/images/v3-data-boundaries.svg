<text x="62" y="273" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">Rotate, zoom, pan</text>
<text x="62" y="309" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">Inspect skills and task events</text>
<text x="62" y="345" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">Review evidence and checks</text>
