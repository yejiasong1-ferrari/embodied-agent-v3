<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
<title id="title">人查看的场景，与机器人使用的证据</title>
<desc id="desc">Studio供人旋转缩放查看，Agent使用腕部RGB-D、VLM身份、世界模型与本体状态。物体真值只用于搭建场景与测试。</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#8edce5" stroke-width="1.6"/></marker>
<marker id="retry" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#edc68d" stroke-width="1.6"/></marker>
<marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#a4dfb9" stroke-width="1.6"/></marker>
</defs>
<rect width="1120" height="570" rx="20" fill="#101820"/>
<text x="40" y="55" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="650" text-anchor="start">人查看的场景，与机器人使用的证据</text>
<text x="40" y="91" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">Studio 展示任务过程，Agent 依据传感器与估计世界模型行动。</text>
<rect x="40" y="143" width="287" height="286" rx="12" fill="#192630" stroke="#354853" stroke-width="1.4"/>
<text x="62" y="181" fill="#8edce5" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" text-anchor="start">STUDIO</text>
<text x="62" y="228" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="600" text-anchor="start">供人观察与检查</text>
<text x="62" y="273" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">旋转、缩放、平移</text>
<text x="62" y="309" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">查看当前技能与任务事件</text>
<text x="62" y="345" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="start">检查相机证据与验收结果</text>
<text x="62" y="400" fill="#8edce5" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start">接收渲染画面与执行事件</text>
<path d="M356 155V421" stroke="#354853" stroke-dasharray="6 7" stroke-width="2"/>
<rect x="386" y="143" width="694" height="286" rx="12" fill="#152a30" stroke="#437783" stroke-width="1.4"/>
<text x="408" y="181" fill="#8edce5" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" text-anchor="start">AGENT</text>
<rect x="408" y="219" width="181" height="143" rx="12" fill="#101820" stroke="#354853" stroke-width="1.4"/>
<text x="422" y="255" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" text-anchor="start">感知</text>
<text x="422" y="292" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">腕部 RGB-D</text>
<text x="422" y="321" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">VLM 身份确认</text>
<rect x="642" y="219" width="181" height="143" rx="12" fill="#101820" stroke="#354853" stroke-width="1.4"/>
<text x="656" y="255" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" text-anchor="start">世界模型</text>
<text x="656" y="292" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">测得的几何</text>
<text x="656" y="321" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">跟踪与时效</text>
<rect x="876" y="219" width="181" height="143" rx="12" fill="#101820" stroke="#354853" stroke-width="1.4"/>
<text x="890" y="255" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" text-anchor="start">执行技能</text>
<text x="890" y="292" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">规划与控制</text>
<text x="890" y="321" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" text-anchor="start">接触与验收</text>
<path d="M593 290H633" fill="none" stroke="#8edce5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M827 290H867" fill="none" stroke="#8edce5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="733" y="400" fill="#8edce5" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="middle">机器人关节、末端位置和接触反馈参与检查</text>
<rect x="40" y="471" width="1040" height="60" rx="12" fill="#2c271f" stroke="#79684e" stroke-width="1.4"/>
<text x="64" y="508" fill="#edc68d" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="500" text-anchor="start">物体登记与仿真真值 → 场景构建和测试验收，运行时决策使用传感器证据</text>
</svg>
