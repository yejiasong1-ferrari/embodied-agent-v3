<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="585" viewBox="0 0 1120 585" role="img" aria-labelledby="title desc">
<title id="title">Three responsibilities, one robot action</title>
<desc id="desc">The VLM establishes identity, RGB-D estimates geometry, and local planning and control check and execute motion.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#8edce5" stroke-width="1.6"/></marker>
<marker id="retry" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#edc68d" stroke-width="1.6"/></marker>
<marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#a4dfb9" stroke-width="1.6"/></marker>
</defs>
<rect width="1120" height="585" rx="20" fill="#101820"/>
<text x="40" y="55" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="650" text-anchor="start">Three responsibilities, one robot action</text>
<text x="40" y="91" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">Each module supplies evidence that the next stage can check.</text>
<rect x="40" y="142" width="300" height="294" rx="12" fill="#192630" stroke="#8edce5" stroke-width="1.4"/>
<text x="60" y="178" fill="#8edce5" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" text-anchor="start">VLM</text>
<text x="60" y="224" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="600" text-anchor="start">Which object?</text>
<text x="60" y="270" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Full instruction + RGB images</text>
<text x="60" y="304" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Compare shape and attributes</text>
<text x="60" y="338" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Instance, region, visual evidence</text>
<path d="M60 371H320" fill="none" stroke="#354853" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="60" y="407" fill="#8edce5" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start">Can request more observation</text>
<rect x="410" y="142" width="300" height="294" rx="12" fill="#192630" stroke="#adc3f0" stroke-width="1.4"/>
<text x="430" y="178" fill="#adc3f0" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" text-anchor="start">RGB-D + world model</text>
<text x="430" y="224" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="600" text-anchor="start">Where is it?</text>
<text x="430" y="270" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Depth + calibrated observations</text>
<text x="430" y="304" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Position, size, collision geometry</text>
<text x="430" y="338" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Visibility and observation age</text>
<path d="M430 371H690" fill="none" stroke="#354853" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="430" y="407" fill="#adc3f0" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start">Track identity and position age</text>
<rect x="780" y="142" width="300" height="294" rx="12" fill="#192630" stroke="#a4dfb9" stroke-width="1.4"/>
<text x="800" y="178" fill="#a4dfb9" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" text-anchor="start">Planning + control</text>
<text x="800" y="224" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="600" text-anchor="start">Can it be moved?</text>
<text x="800" y="270" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Grasp candidates + kinematics</text>
<text x="800" y="304" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Collision, trajectory, contact</text>
<text x="800" y="338" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Execute and check feedback</text>
<path d="M800 371H1060" fill="none" stroke="#354853" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="800" y="407" fill="#a4dfb9" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start">Local checks authorize motion</text>
<path d="M345 289H402" fill="none" stroke="#8edce5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M715 289H772" fill="none" stroke="#8edce5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="40" y="473" width="1040" height="71" rx="12" fill="#162e2a" stroke="#477d66" stroke-width="1.4"/>
<text x="560" y="517" fill="#a4dfb9" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="500" text-anchor="middle">Confirmed identity + fresh geometry + feasible motion → permission to act</text>
</svg>
