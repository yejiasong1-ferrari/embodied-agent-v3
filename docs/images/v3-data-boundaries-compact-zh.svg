<rect x="56" y="348" width="648" height="96" rx="12" fill="#101820" stroke="#354853" stroke-width="1.4"/>
<text x="78" y="385" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="600" text-anchor="start">感知</text>
<text x="78" y="421" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">腕部 RGB-D + VLM 身份确认</text>
<rect x="56" y="462" width="648" height="96" rx="12" fill="#101820" stroke="#354853" stroke-width="1.4"/>
