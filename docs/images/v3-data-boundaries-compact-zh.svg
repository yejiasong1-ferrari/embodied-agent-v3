<text x="54" y="207" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="600" text-anchor="start">供人查看</text>
<text x="340" y="173" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">旋转、缩放、平移</text>
<text x="340" y="208" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">查看技能、证据与验收</text>
<rect x="32" y="292" width="696" height="408" rx="12" fill="#152a30" stroke="#437783" stroke-width="1.4"/>
