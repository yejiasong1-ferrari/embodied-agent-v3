<text x="78" y="535" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">测得的几何 + 跟踪与测量时效</text>
<rect x="56" y="576" width="648" height="96" rx="12" fill="#101820" stroke="#354853" stroke-width="1.4"/>
<text x="78" y="613" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="600" text-anchor="start">执行技能</text>
<text x="78" y="649" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" text-anchor="start">规划、控制、接触与验收反馈</text>
