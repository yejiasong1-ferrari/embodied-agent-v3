<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
<title id="title">From a request to a checked outcome</title>
<desc id="desc">Six stages form a loop. Weak evidence or a failed action returns to observation and replanning within a retry budget.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#8edce5" stroke-width="1.6"/></marker>
<marker id="retry" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#edc68d" stroke-width="1.6"/></marker>
<marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#a4dfb9" stroke-width="1.6"/></marker>
</defs>
<rect width="1120" height="570" rx="20" fill="#101820"/>
<text x="40" y="55" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="650" text-anchor="start">From a request to a checked outcome</text>
<text x="40" y="91" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" text-anchor="start">Confirm identity, measure the scene, and observe again after acting.</text>
<rect x="40" y="142" width="300" height="126" rx="12" fill="#192630" stroke="#354853" stroke-width="1.4"/>
<text x="60" y="171" fill="#8edce5" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="650" text-anchor="start">01</text>
<text x="60" y="207" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="600" text-anchor="start">Interpret the task</text>
<text x="60" y="241" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Object, reference, relation</text>
<rect x="410" y="142" width="300" height="126" rx="12" fill="#192630" stroke="#354853" stroke-width="1.4"/>
<text x="430" y="171" fill="#8edce5" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="650" text-anchor="start">02</text>
<text x="430" y="207" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="600" text-anchor="start">Observe the scene</text>
<text x="430" y="241" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Wrist RGB-D and safe views</text>
<rect x="780" y="142" width="300" height="126" rx="12" fill="#192630" stroke="#8edce5" stroke-width="1.4"/>
<text x="800" y="171" fill="#8edce5" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="650" text-anchor="start">03</text>
<text x="800" y="207" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="600" text-anchor="start">Confirm identity</text>
<text x="800" y="241" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">VLM confirms the instance</text>
<rect x="780" y="350" width="300" height="126" rx="12" fill="#192630" stroke="#354853" stroke-width="1.4"/>
<text x="800" y="379" fill="#8edce5" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="650" text-anchor="start">04</text>
<text x="800" y="415" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="600" text-anchor="start">Measure and track</text>
<text x="800" y="449" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Depth, geometry, freshness</text>
<rect x="410" y="350" width="300" height="126" rx="12" fill="#192630" stroke="#354853" stroke-width="1.4"/>
<text x="430" y="379" fill="#8edce5" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="650" text-anchor="start">05</text>
<text x="430" y="415" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="600" text-anchor="start">Plan and execute</text>
<text x="430" y="449" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Check, grasp, move, release</text>
<rect x="40" y="350" width="300" height="126" rx="12" fill="#192630" stroke="#a4dfb9" stroke-width="1.4"/>
<text x="60" y="379" fill="#a4dfb9" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="650" text-anchor="start">06</text>
<text x="60" y="415" fill="#edf4f7" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="600" text-anchor="start">Verify the result</text>
<text x="60" y="449" fill="#aec0cb" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" text-anchor="start">Relation, release, stability</text>
<path d="M344 205H402" fill="none" stroke="#8edce5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M714 205H772" fill="none" stroke="#8edce5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M930 272V342" fill="none" stroke="#8edce5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M776 413H718" fill="none" stroke="#8edce5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M406 413H348" fill="none" stroke="#8edce5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M40 413H18V303H560V276" fill="none" stroke="#edc68d" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#retry)"/>
<text x="265" y="332" fill="#edc68d" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Uncertain or failed → reobserve and replan</text>
<text x="560" y="530" fill="#a4dfb9" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="500" text-anchor="middle">Completion requires fresh evidence and an accepted final check</text>
</svg>
